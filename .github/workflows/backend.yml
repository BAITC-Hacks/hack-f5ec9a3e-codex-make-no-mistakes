name: Backend and source audit
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: replenishment
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: replenishment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replenishment -d replenishment_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://replenishment:local_ci_only@localhost:5432/replenishment_test
      ORDERING_TEST_DATABASE_URL: postgresql+psycopg://replenishment:local_ci_only@localhost:5432/replenishment_ordering_test
      API_TEST_DATABASE_URL: postgresql+psycopg://replenishment:local_ci_only@localhost:5432/replenishment_api_test
      IMPORT_TEST_DATABASE_URL: postgresql+psycopg://replenishment:local_ci_only@localhost:5432/replenishment_import_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Create isolated integration databases
        env:
          PGPASSWORD: local_ci_only
        run: |
          createdb -h localhost -U replenishment replenishment_ordering_test
          createdb -h localhost -U replenishment replenishment_api_test
          createdb -h localhost -U replenishment replenishment_import_test
          createdb -h localhost -U replenishment replenishment_audit
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest -q
      - name: Import all source workbooks and reconcile independently
        env:
          DATABASE_URL: postgresql+psycopg://replenishment:local_ci_only@localhost:5432/replenishment_audit
        run: |
          uv run alembic upgrade head
          uv run python -m replenishment.cli.import_excel ../docs/data
          uv run python -m replenishment.cli.audit_data ../docs/data --output-dir ../artifacts/data-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: artifacts/data-audit/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
