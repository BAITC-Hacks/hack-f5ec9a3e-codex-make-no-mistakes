name: Backend and source audit
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: replenishment
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: replenishment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replenishment -d replenishment_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://replenishment:local_ci_only@localhost:5432/replenishment_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest -q
