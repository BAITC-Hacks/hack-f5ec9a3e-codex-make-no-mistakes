# Local demo. Source files stay read-only; imported data and scenarios live in pgdata.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: replenishment
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: replenishment
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replenishment -d replenishment"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://replenishment:local_dev_only@db:5432/replenishment
    volumes:
      - ./docs/data:/app/docs/data:ro
      - ./docs/sources/almaty-routing:/app/docs/sources/almaty-routing:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 300s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
